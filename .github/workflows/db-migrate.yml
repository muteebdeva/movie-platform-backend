# One-time / on-demand database operations for the Supabase project.
# Trigger manually: Actions -> "DB migrate" -> Run workflow.
# Uses the SUPABASE_DB_PASSWORD repo secret (delete it after use).
#
# Connects via the Supavisor pooler (IPv4, session mode) because the direct
# db.* hostname is IPv6-only and GitHub runners lack IPv6 egress.
name: DB migrate

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Only verify the DB connection (skip all operations)'
        type: boolean
        default: false
      promote_email:
        description: 'Email address to promote to admin (leave empty to skip)'
        type: string
        default: ''
      test_sql_b64:
        description: 'Base64-encoded SQL to run as a test (leave empty to skip)'
        type: string
        default: ''

env:
  PGURI: postgresql://postgres.cqdqljmvlrtqwzzgqiqt@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Verify connection
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql "$PGURI" -c "select current_user as connected_as;"

      - name: Run migrations
        if: ${{ inputs.verify_only != true && inputs.promote_email == '' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "== applying $f =="
            psql "$PGURI" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Confirm objects
        if: ${{ inputs.verify_only != true && inputs.promote_email == '' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql "$PGURI" \
            -c "select tablename from pg_tables where schemaname='public' and tablename in ('profiles','notifications','notification_reads','admin_audit_log','moderation_reports','moderator_notes') order by 1;" \
            -c "select tablename, policyname from pg_policies where schemaname='public' order by 1,2;" \
            -c "select tgname from pg_trigger where tgname in ('profiles_guard_role','on_auth_user_created');" \
            -c "select u.email, p.role from auth.users u join public.profiles p on p.id = u.id order by p.created_at;"

      - name: Promote admin
        if: ${{ inputs.promote_email != '' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROMOTE_EMAIL: ${{ inputs.promote_email }}
        run: |
          psql "$PGURI" -v ON_ERROR_STOP=1 \
            -c "update public.profiles set role = 'owner' where id = (select id from auth.users where email = '$PROMOTE_EMAIL');" \
            -c "select u.email, p.display_name, p.role from auth.users u join public.profiles p on p.id = u.id where u.email = '$PROMOTE_EMAIL';"

      - name: Run test SQL
        if: ${{ inputs.test_sql_b64 != '' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          TEST_SQL_B64: ${{ inputs.test_sql_b64 }}
        run: |
          echo "$TEST_SQL_B64" | base64 -d > /tmp/test.sql
          psql "$PGURI" -v ON_ERROR_STOP=1 -f /tmp/test.sql
          shred -u /tmp/test.sql
